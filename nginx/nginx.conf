# DocReview360 nginx reverse proxy configuration.
# Supports WebSocket connections (real-time collaboration), HTTP/2, and TLS termination.
#
# Usage: nginx -c /path/to/nginx.conf
# Or copy into /etc/nginx/conf.d/docreview360.conf

upstream docreview360_api {
    least_conn;
    server 127.0.0.1:8000 weight=1 max_fails=3 fail_timeout=30s;
    # Add more backend servers for horizontal scaling:
    # server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name docreview360.example.gov;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docreview360.example.gov;

    # TLS configuration — replace with your certificate paths
    ssl_certificate     /etc/ssl/certs/docreview360.crt;
    ssl_certificate_key /etc/ssl/private/docreview360.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (2 years, includeSubDomains, preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    client_max_body_size 50M;

    # ── REST API ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://docreview360_api;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 16k;
    }

    # ── WebSocket (real-time collaboration /ws/collab/...) ───────────────────
    location /ws/ {
        proxy_pass         http://docreview360_api;
        proxy_http_version 1.1;

        # Required WebSocket upgrade headers
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeouts for persistent WebSocket connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Disable buffering for streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Static assets (Next.js built output) ─────────────────────────────────
    location /_next/static/ {
        proxy_pass http://docreview360_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health probes (no logging) ────────────────────────────────────────────
    location /health {
        proxy_pass         http://docreview360_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Metrics (restrict to internal network) ───────────────────────────────
    location /metrics {
        proxy_pass         http://docreview360_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        allow              10.0.0.0/8;
        allow              172.16.0.0/12;
        allow              192.168.0.0/16;
        deny               all;
    }
}
