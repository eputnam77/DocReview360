# Production Docker Compose stack for DocReview360.
#
# Prerequisites:
#   1. Create a .env.prod file with all required secrets (see .env.example).
#   2. Place TLS certificates in ./nginx/certs/ (nginx.crt, nginx.key).
#   3. Run: docker compose -f docker-compose.prod.yml up -d
#
# Health checks: /health/live (liveness), /health/ready (readiness + DB).

version: "3.9"

x-app-env: &app-env
  env_file: .env.prod
  environment:
    DOCREVIEW360_ENV: production
    DOCREVIEW360_DATABASE: postgresql
    DOCREVIEW360_STRUCTURED_LOGGING: "1"
    DOCREVIEW360_OTEL_ENABLED: "${OTEL_ENABLED:-0}"
    DOCREVIEW360_RATE_LIMIT_ENABLED: "1"
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    CELERY_EAGER: "0"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docreview360
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: docreview360
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docreview360"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD}" --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── API server ──────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/eputnam77/docreview360:${APP_VERSION:-latest}
    restart: unless-stopped
    <<: *app-env
    command: >
      uvicorn docreview360.api:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --proxy-headers
        --forwarded-allow-ips='*'
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal
      - proxy

  # ── Celery worker ───────────────────────────────────────────────────────────
  worker:
    image: ghcr.io/eputnam77/docreview360:${APP_VERSION:-latest}
    restart: unless-stopped
    <<: *app-env
    command: celery -A docreview360.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "docreview360.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

  # ── Celery beat (scheduled tasks) ──────────────────────────────────────────
  beat:
    image: ghcr.io/eputnam77/docreview360:${APP_VERSION:-latest}
    restart: unless-stopped
    <<: *app-env
    command: celery -A docreview360.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/docreview360.conf:ro
      - ./nginx/certs:/etc/ssl:ro
    depends_on:
      - web
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true
  proxy:
    driver: bridge
