repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-PyYAML, types-redis]
        args: []
        files: ^src/
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-lll", "-r", "src"]
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        entry: semgrep --config p/ci --metrics=off --disable-version-check
        language: system
        pass_filenames: false
