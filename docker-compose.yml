version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docreview360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}
      POSTGRES_DB: docreview360
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "5432:5432"
  search:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  web:
    build: .
    command: python -m uvicorn docreview360.api:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_EAGER=0
    depends_on:
      - db
      - search
      - redis
  worker:
    build: .
    command: celery -A docreview360.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_EAGER=0
    depends_on:
      - redis
