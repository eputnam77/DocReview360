version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow
      POSTGRES_DB: docuflow
    ports:
      - "5432:5432"
  search:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  web:
    build: .
    command: python -m uvicorn docuflow.api:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - search
      - redis
  worker:
    build: .
    command: celery -A docuflow.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
