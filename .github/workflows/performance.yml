name: Performance

on:
  workflow_dispatch:

jobs:
  signature-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run signature verification stress test
        env:
          DOCREVIEW360_SECRET_KEY: test
          DOCREVIEW360_ALGORITHM: HS256
          DOCREVIEW360_ACCESS_EXPIRE_MINUTES: 30
          DOCREVIEW360_OIDC_SECRET_KEY: test
          DOCREVIEW360_OIDC_ALGORITHM: HS256
          DOCREVIEW360_OIDC_EXPIRE_MINUTES: 30
          PYTHONPATH: src
        run: |
          python scripts/signature_stress.py
