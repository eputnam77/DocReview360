name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev
          npm ci --prefix frontend || true
      - name: Run quality gate
        run: |
          poetry run ruff check src tests
          poetry run black --check src tests
          poetry run mypy --strict src
          poetry run bandit -r src -lll --skip B101
          THRESHOLD=70
          if [ "$GITHUB_REF_NAME" = "main" ]; then THRESHOLD=90; fi
          poetry run pytest -q --cov=src --cov-fail-under=$THRESHOLD
          npx tsc --noEmit
          cargo check || true
          go vet ./...
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
