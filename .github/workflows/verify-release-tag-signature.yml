name: Verify Release Tag Signature

on:
  push:
    tags:
      - "v*"

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify git tag signature
        run: |
          git verify-tag "${GITHUB_REF_NAME}"
