name: Mirror to Codeberg

on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Required configuration:
      # Secrets:
      #   - CODEBERG_TOKEN: Personal access token with write access to the target Codeberg repo.
      # Variables (optional):
      #   - CODEBERG_OWNER: Codeberg user/org that owns the target repo.
      #                    Defaults to github.repository_owner when unset.
      - name: Mirror all branches and tags to Codeberg
        shell: bash
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_OWNER_VAR: ${{ vars.CODEBERG_OWNER }}
          DEFAULT_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -euo pipefail

          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          CODEBERG_OWNER="${CODEBERG_OWNER_VAR:-$DEFAULT_OWNER}"

          if [[ -z "${CODEBERG_TOKEN:-}" ]]; then
            echo "Error: required secret CODEBERG_TOKEN is not set." >&2
            exit 1
          fi
          if [[ -z "${CODEBERG_OWNER}" ]]; then
            echo "Error: CODEBERG owner resolved to empty. Set vars.CODEBERG_OWNER or ensure github.repository_owner is available." >&2
            exit 1
          fi

          SOURCE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          CODEBERG_URL="https://${CODEBERG_OWNER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_OWNER}/${REPO_NAME}.git"

          git clone --mirror "${SOURCE_URL}" repo.git
          cd repo.git
          git push --mirror "${CODEBERG_URL}"
