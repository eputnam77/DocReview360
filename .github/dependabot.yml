version: 2
updates:
  # Python dependencies via pip/uv (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # Pin Python runtime version explicitly; don't auto-bump major
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  # npm / Node.js (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      nextjs-stack:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      tiptap:
        patterns:
          - "@tiptap/*"
      testing:
        patterns:
          - "jest*"
          - "@testing-library/*"
          - "cypress*"
          - "playwright*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
