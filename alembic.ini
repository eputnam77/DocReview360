# Alembic configuration for DocReview360.
#
# Usage:
#   alembic upgrade head        — apply all pending migrations
#   alembic downgrade -1        — roll back the last migration
#   alembic revision --autogenerate -m "describe change"
#                               — generate a new migration from model diff
#   alembic stamp head          — mark current DB as "at head" (existing installs)
#   alembic history             — show migration history
#
# The database URL is read from the DOCREVIEW360_DATABASE_URL environment
# variable; the value below is only used when that variable is not set.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///docreview360.db

[post_write_hooks]
# Uncomment to auto-format new migration scripts:
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
