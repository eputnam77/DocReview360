apiVersion: v1
kind: ConfigMap
metadata:
  name: docreview360-config
  namespace: docreview360
data:
  DOCREVIEW360_ENV: "production"
  DOCREVIEW360_DATABASE: "postgresql"
  DOCREVIEW360_STRUCTURED_LOGGING: "1"
  DOCREVIEW360_OTEL_ENABLED: "1"
  DOCREVIEW360_OTEL_SERVICE_NAME: "docreview360"
  DOCREVIEW360_RATE_LIMIT_ENABLED: "1"
  DOCREVIEW360_RATE_LIMIT_DEFAULT: "100"
  DOCREVIEW360_RATE_LIMIT_WINDOW: "60"
  CELERY_EAGER: "0"
