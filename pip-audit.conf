# pip-audit configuration file
# This file configures pip-audit behavior

# Suppress cache warnings
[audit]
# Ignore cache-related warnings
ignore-cache-warnings = true

# Configure output format
format = "text"

# Set log level to reduce noise
log-level = "WARNING"

# Ignore local packages that aren't on PyPI
[audit.ignore]
# Ignore local packages that can't be audited
packages = [
    "docreview360",
    "fedstylevalidator"
]

# Configure vulnerability handling
[audit.vulnerabilities]
# Allow some vulnerabilities to be ignored if they're in dev dependencies
allow-dev-vulnerabilities = false

# Configure cache settings
[cache]
# Disable cache to avoid deserialization warnings
enabled = false
