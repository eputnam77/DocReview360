# ─────────────────────────────── build & metadata ──────────────────────────────
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "docreview360"
version         = "0.1.2"
description     = "DocReview360 simplifies document workflows with approvals and templates."
readme          = "README.md"
requires-python = ">=3.11,<3.13"
license         = { text = "MIT" }
license-files   = ["LICENSE"]
keywords        = [
  "document-review",
  "workflow",
  "approvals",
  "audit-trail",
  "fastapi",
  "compliance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Groupware",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]

dependencies = [
  "Jinja2==3.1.6",
  "pydantic==2.11.7",
  "matplotlib==3.10.3",
  "fonttools==4.61.0",
  "Pillow==12.1.1",
  "click==8.1.8",
  "PyYAML==6.0.2",
  "zipp==3.19.1",
  "wikipedia==1.4.0",
  "textstat==0.7.7",
  "textblob==0.19.0",
  "fastapi>=0.120.0",
  "python-multipart==0.0.22",
  "SQLAlchemy==2.0.41",
  "httpx==0.28.1",
  "python-jose[cryptography]==3.5.0",
  "python-docx==1.2.0",

  # python-magic is problematic on Windows unless you use the prebuilt binary wheel package.
  # Ref: https://pypi.org/project/python-magic/
  "python-magic==0.4.27; platform_system != 'Windows'",
  "python-magic-bin; platform_system == 'Windows'",

  "reportlab==4.4.3",
  "celery==5.5.3",
  "redis==6.2.0",
  "graphene==3.4.3",
  "prometheus-client==0.22.1",
  "starlette>=0.49,<0.50",
  "uvicorn>=0.38.0",
  "pymysql==1.1.1",
  "python-dotenv==1.0.0",
  "bcrypt==4.2.0",
  "pyotp==2.9.0",
  "markdown-it-py==3.0.0",
  "bleach==6.2.0",
]

[project.urls]
Homepage      = "https://github.com/eputnam77/DocReview360"
Repository    = "https://github.com/eputnam77/DocReview360"
Issues        = "https://github.com/eputnam77/DocReview360/issues"
Changelog     = "https://github.com/eputnam77/DocReview360/blob/main/CHANGELOG.md"

[[project.authors]]
name  = "Eric Putnam"
email = "info@example.com"

[project.scripts]
docreview360 = "docreview360.cli:cli"

# ───────────────────────────── optional deps buckets ───────────────────────────
[project.optional-dependencies]

# FedStyleValidator (Federal Style Validator) is optional; the core app
# falls back to internal heuristics when the integration is unavailable.
fedstylevalidator = ["FedStyleValidator @ git+https://github.com/eputnam77/FedStyleValidator.git"]

# tokenizer support for OpenAI / tiktoken
tokenizer = ["tiktoken>=0.5.1"]

# PostgreSQL support (LGPL-3.0 — kept optional so the core package is MIT-clean)
postgres = ["psycopg[binary]==3.2.9"]

# LDAP/Active Directory authentication (Item 37)
ldap = ["ldap3>=2.9"]

# SAML 2.0 Service Provider authentication (Item 37)
saml = ["python3-saml>=1.16"]

realtime = [
  "y-py>=0.6,<0.8",
  "ypy-websocket>=0.12,<0.14",
]

# ML (kept optional so Windows installs don't fail when torch wheels aren't available)
# PyTorch install matrix: https://pytorch.org/get-started/locally/
ml = [
  "torch==2.8.0",
  "onnx==1.17.0",
]

# Choose ONE runtime extra depending on target.
# ONNX Runtime install docs: https://onnxruntime.ai/docs/install/
ml-cpu = [
  "onnxruntime==1.19.2 ; platform_system != 'Darwin' or platform_machine != 'arm64'",
]

ml-mps = [
  "onnxruntime==1.19.2 ; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

ml-gpu = [
  "onnxruntime-gpu==1.19.2 ; platform_system != 'Darwin'",
]

# formatting & linting
format = ["ruff>=0.5", "black>=24"]
lint   = ["ruff>=0.5", "black>=24"]

# static typing
typing = ["mypy>=1.10"]

# testing & quality gates (unit, property, E2E, mutation, coverage)
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "pytest-asyncio>=0.23",
  "pytest-playwright>=0.4",
  "playwright>=1.44",
  "mutmut>=2.4",
  "uvicorn>=0.38.0",
]

# security scanning
security = [
  "bandit[toml]>=1.8.5",
  "semgrep>=1.123.0",
  "pip-audit>=2.7",
]

# developer convenience
qa = ["pre-commit>=3.7"]

dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "pytest-asyncio>=0.23",
  "pytest-playwright>=0.4",
  "playwright>=1.44",
  "mutmut>=2.4",
  "bandit[toml]>=1.8.5",
  "semgrep>=1.123.0",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "uvicorn>=0.38.0",
  "ldap3>=2.9",
  "python3-saml>=1.16",
]

# ──────────────────────────── package discovery ───────────────────────────────
[tool.setuptools]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", ".dev*"]

[tool.setuptools.package-data]
"docreview360.styles"        = ["*.md"]
"docreview360.templates"     = ["*.html"]
"docreview360.iac_templates" = ["*.tf"]
"docreview360"              = ["py.typed"]
"docreview360.migrations"   = ["*.sql"]
"*"                          = ["*.txt", "*.md", "*.yaml", "*.yml", "*.json"]

# ───────────────────────────── code style tools ───────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]

# ───────────────────────────── static typing (mypy) ───────────────────────────
[tool.mypy]
python_version = "3.12"
strict         = true
ignore_errors  = false
plugins        = ["pydantic.mypy"]
exclude        = "(tests/|src/docreview360/document_checker.py)"

[[tool.mypy.overrides]]
module = [
  "Jinja2.*",
  "matplotlib.*",
  "fonttools.*",
  "Pillow.*",
  "click.*",
  "yaml",
  "sentry_sdk",
  "celery",
  "celery.*",
  "UnleashClient",
  "graphene.*",
  "jose.*",
  "markdown_it.*",
  "pytest_bdd",
  "httpx",
  "fastapi",
  "fastapi.*",
  "starlette",
  "starlette.*",
  "sqlalchemy",
  "sqlalchemy.*",
  "prometheus_client",
  "cryptography",
  "cryptography.*",
  "dotenv",
  "uvicorn",
  "uvicorn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["fedstylevalidator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# FastAPI and Click route/command decorators emit untyped-decorator errors because
# their decorator factories return `Callable[..., Any]`. Disabling this one check
# is the minimal suppression; all other strict rules still apply to these modules.
module = [
  "docreview360.cli",
  "docreview360.nemo_guardrails",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# docreview360.cache uses a runtime-optional Redis import pattern (try/except at
# module level) that produces assignment/union-attr errors because mypy cannot
# narrow the `_redis` name after the bare `except Exception` clause.  The
# conditional Redis client initialisation is well-tested; the suppression is
# intentional and limited to this module.
module = ["docreview360.cache"]
disable_error_code = ["assignment", "union-attr", "attr-defined"]

[[tool.mypy.overrides]]
# docreview360.models defines a Pydantic BaseModel fallback stub (for environments
# where pydantic is unavailable) using `# type: ignore[no-redef]` on the class
# body.  The no-redef error is the only known mypy issue in this module.
# nemo_guardrails depends on heavy optional third-party stubs that are not
# available in CI; ignore_errors is kept for that module only.
module = ["docreview360.nemo_guardrails"]
ignore_errors = true

[[tool.mypy.overrides]]
# The fallback `BaseModel` stub in models.py redefines the class name imported
# from pydantic inside a try/except block, which mypy flags as no-redef.  All
# other strict checks are enabled for this module.
module = ["docreview360.models"]
disable_error_code = ["no-redef"]

# ───────────────────────────── pytest config ───────────────────────────────
[tool.pytest.ini_options]
markers = [
  "property: property-based tests powered by Hypothesis",
  "e2e: end-to-end tests requiring Playwright",
  "e2e_smoke: critical browser/API smoke flows for pre-merge gating",
  "e2e_full: broader E2E coverage including permissions and edge cases",
]
addopts = "--screenshot=off --video=off --tracing=off"

# ──────────────────────── security scanning (Bandit) ──────────────────────────
[tool.bandit]
targets      = ["src/docreview360"]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips        = ["B101", "B110", "B311"]

[tool.bandit.any_other_function_with_shell_equals_true]
no_shell = ["os.execl", "os.execle", "os.spawnl", "os.spawnv"]
shell    = ["os.system", "subprocess.Popen"]

[tool.coverage.run]
omit = [
  "src/docreview360/templates/*",
  "src/docreview360/styles/*",
  "src/docreview360/scripts/*",
  "src/docreview360/records.py",
  "src/docreview360/git_hooks.py",
]