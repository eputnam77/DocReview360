# ─────────────────────────────── build & metadata ──────────────────────────────
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
name = "docreview360"
version = "0.1.1"
description = "DocReview360 simplifies document workflows with approvals and templates."
authors = ["Eric Putnam <info@example.com>"]
packages = [{ include = "docreview360", from = "src" }]

[project]
name            = "docreview360"
version         = "0.1.1"
description     = "DocReview360 simplifies document workflows with approvals and templates."
readme          = "README.md"
requires-python = ">=3.12,<4"

dependencies = [
  "Jinja2>=3.1.0",
  "pydantic>=2.0",
  "matplotlib>=3.0",
  "fonttools>=4.43.0",
  "Pillow>=10.2.0",
  "click>=8.0",
  "PyYAML>=6.0",
  "zipp>=3.19.1",
  "wikipedia>=1.4",
  "textstat>=0.7",
  "textblob>=0.19",
  "fastapi>=0.110",
  "python-multipart>=0.0.6",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "celery>=5.3",
  "redis>=5.0",
  "graphene>=3.3",
  "prometheus-client>=0.20",
  "uvicorn>=0.35.0",
]

[[project.authors]]
name  = "Eric Putnam"
email = "info@example.com"

[project.scripts]
docreview360 = "docreview360.cli:cli"

# ───────────────────────────── optional deps buckets ───────────────────────────
[project.optional-dependencies]
# tokenizer support for OpenAI / tiktoken
tokenizer = ["tiktoken>=0.5.1"]

# formatting & linting
format   = ["ruff>=0.5"]
lint     = ["ruff>=0.5"]

# static typing
typing   = ["mypy>=1.10"]

# testing & quality gates (unit, property, E2E, mutation, coverage)
# NOTE: Playwright binaries are only required locally/CI, not at runtime
#       Mutmut enables mutation‑testing gate introduced in AGENTS.md v0.4
#       pytest‑playwright integrates Playwright with pytest collection.
#       Versions chosen to satisfy Python 3.12 wheels.

test = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "pytest-asyncio>=0.23",
  "pytest-playwright>=0.4",
  "playwright>=1.44",
  "mutmut>=2.4",
  "uvicorn>=0.35.0",
]

# security scanning
security = [
  "bandit[toml]>=1.8.5",       # "toml" extra lets Bandit parse this file
  "semgrep>=1.123.0",
  "pip-audit>=2.7",
]

# developer convenience (superset of all tools)
qa  = ["pre-commit>=3.7"]

dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "pytest-asyncio>=0.23",
  "pytest-playwright>=0.4",
  "playwright>=1.44",
  "mutmut>=2.4",
  "bandit[toml]>=1.8.5",
  "semgrep>=1.123.0",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "uvicorn>=0.35.0",
]

# ───────────────────────────── poetry dependency groups ─────────────────────────────
[tool.poetry.group.dev.dependencies]
ruff = ">=0.5"
mypy = ">=1.10"
pytest = ">=8"
pytest-cov = ">=5"
hypothesis = ">=6"
pytest-playwright = ">=0.4"
playwright = ">=1.44"
mutmut = ">=2.4"
bandit = {version = ">=1.8.5", extras = ["toml"]}
semgrep = ">=1.123.0"
pip-audit = ">=2.7"
pre-commit = ">=3.7"
pytest-asyncio = ">=0.23"
uvicorn = ">=0.35.0"

# ──────────────────────────── package discovery ───────────────────────────────

[tool.setuptools]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", ".dev*"]

[tool.setuptools.package-data]
"docreview360.styles" = ["*.md"]
"docreview360.templates" = ["*.html"]
"docreview360.iac_templates" = ["*.tf"]
"docreview360" = ["py.typed"]
"*" = ["*.txt", "*.md", "*.yaml", "*.yml"]

# ───────────────────────────── code style tools ───────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]

# ───────────────────────────── static typing (mypy) ───────────────────────────
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_errors          = false
plugins                = ["pydantic.mypy"]   # Pydantic‑v2 plugin
exclude                = ["tests/*"]

[[tool.mypy.overrides]]
module                 = [
  "Jinja2.*",
  "matplotlib.*",
  "fonttools.*",
  "Pillow.*",
  "click.*",
  "yaml",
  "sentry_sdk",
  "celery",
  "celery.*",
  "UnleashClient",
  "graphene.*",
  "jose.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
ignore_errors = true

# ───────────────────────────── pytest config ───────────────────────────────
[tool.pytest.ini_options]
markers = [
    # Custom markers must be declared here to silence PytestUnknownMarkWarning
    "property: property-based tests powered by Hypothesis",
]

# (optional) other pytest settings you may want:
# addopts = "-ra -q"
# testpaths = ["tests"]

# ──────────────────────── security scanning (Bandit) ──────────────────────────
[tool.bandit]
targets      = ["src/docreview360"]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips        = ["B101", "B110", "B311"]

# Example per-plugin override (optional)
[tool.bandit.any_other_function_with_shell_equals_true]
no_shell = ["os.execl", "os.execle", "os.spawnl", "os.spawnv"]
shell    = ["os.system", "subprocess.Popen"]

[tool.coverage.run]
omit = [
  "src/docreview360/templates/*",
  "src/docreview360/styles/*",
  "src/docreview360/stubs/*",
  "src/docreview360/scripts/*",
  "src/docreview360/records.py",
]


